<div class="login-wrap">
  <mat-card class="login-card" appearance="outlined">
    <div class="login-head">
      <mat-icon class="login-logo">smart_toy</mat-icon>
      <h1>Chatbot Admin</h1>
      <p class="subtitle">Manage your bots, knowledge, and embeds.</p>
    </div>

    <mat-button-toggle-group
      class="mode-toggle"
      [value]="mode()"
      (change)="setMode($event.value)"
      hideSingleSelectionIndicator
    >
      <mat-button-toggle value="login">Sign in</mat-button-toggle>
      <mat-button-toggle value="register">Create account</mat-button-toggle>
    </mat-button-toggle-group>

    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }

    @if (mode() === 'login') {
      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>
        <button
          mat-flat-button
          type="submit"
          class="submit-btn"
          [disabled]="loginForm.invalid || submitting()"
        >
          Sign in
        </button>
      </form>
    } @else {
      <form [formGroup]="registerForm" (ngSubmit)="submitRegister()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Organization name</mat-label>
          <input matInput formControlName="tenant_name" autocomplete="organization" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-hint>At least 8 characters.</mat-hint>
        </mat-form-field>
        <button
          mat-flat-button
          type="submit"
          class="submit-btn"
          [disabled]="registerForm.invalid || submitting()"
        >
          Create account
        </button>
      </form>
    }
  </mat-card>
</div>
