<div class="page detail-page">
  <a routerLink="/" class="back-link">
    <mat-icon>arrow_back</mat-icon>
    <span>All bots</span>
  </a>

  @if (loading()) {
    <div class="center-state"><mat-spinner diameter="36" /></div>
  } @else if (bot(); as b) {
    <header class="detail-header">
      <h1>{{ b.name }}</h1>
      <span class="status-badge" [class.active]="b.status === 'active'">{{ b.status }}</span>
    </header>

    <mat-tab-group class="detail-tabs" animationDuration="0ms">
      <mat-tab label="Settings">
        <div class="tab-body">
          <app-bot-settings [bot]="b" (saved)="onSaved($event)" />
        </div>
      </mat-tab>
      <mat-tab label="Knowledge">
        <ng-template matTabContent>
          <div class="tab-body">
            <app-bot-knowledge [botId]="b.id" />
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Preview">
        <ng-template matTabContent>
          <div class="tab-body">
            <app-bot-preview [botId]="b.id" />
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  } @else {
    <div class="center-state">Bot not found.</div>
  }
</div>
