# Alembic configuration for chatbot-service.
# The DB URL is injected at runtime from chatbot.config (.env), so
# sqlalchemy.url below is intentionally left blank.

[alembic]
# path to migration scripts (os-agnostic forward slashes)
script_location = alembic

# prepend project root to sys.path so `chatbot.*` imports resolve
prepend_sys_path = .

# use os.pathsep to split version_locations
version_path_separator = os

# DB URL injected by alembic/env.py from .env — leave blank.
sqlalchemy.url =


[post_write_hooks]
# No auto-formatting hooks configured.


# ─── Logging ────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
